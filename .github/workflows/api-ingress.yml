name: API ingress contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/api-ingress.yml"
      - "ai_ear/api/**"
      - "ai_ear/core/config.py"
      - "ai_ear/__main__.py"
      - "tests/test_api.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-ingress.yml"
      - "ai_ear/api/**"
      - "ai_ear/core/config.py"
      - "ai_ear/__main__.py"
      - "tests/test_api.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ai-ear-api-ingress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy fastapi uvicorn websockets python-multipart pydantic pydantic-settings httpx pytest pytest-asyncio soundfile
      - name: Compile package
        run: python -m compileall -q ai_ear
      - name: Run API regression suite
        run: python -m pytest -q tests/test_api.py
